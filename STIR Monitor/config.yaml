# STIR Monitor configuration. Every external identifier lives here so a broken
# ticker or a new meeting date is a one-line fix.

yahoo:
  # Yahoo contract-month ticker template. {root}{month}{yy}.{exchange}
  #   SR3Z26.CME = Dec-26 3M SOFR future, ZQF27.CBT = Jan-27 30D Fed Funds future.
  ticker_template: "{root}{month}{yy}.{exchange}"
  intraday_interval: "5m"
  intraday_period: "5d"
  daily_period: "1y"

sofr_futures:
  root: SR3
  exchange: CME
  # Outright columns of the heatmap (Z29 is fetched for the Z8Z9 spread only).
  contracts: [U26, Z26, H27, M27, U27, Z27, H28, M28, U28, Z28, H29, M29]
  extra_contracts: [Z29]
  dec_pairs: [[Z26, Z27, Z6Z7], [Z27, Z28, Z7Z8], [Z28, Z29, Z8Z9]]
  sentiment_contract: Z27

fed_funds_futures:
  root: ZQ
  exchange: CBT

# FOMC decision days (second day of the meeting). 2027 dates are provisional:
# check them against federalreserve.gov/monetarypolicy/fomccalendars.htm.
fomc_meetings:
  - 2026-12-09
  - 2027-01-27
  - 2027-03-17
  - 2027-04-28
  - 2027-06-16
  - 2027-07-28
  - 2027-09-22
  - 2027-11-03

# Bonds view of the "Net change curve" widget (Yahoo yield indices, quoted in %).
bonds:
  - {label: "UST 3M", ticker: "^IRX"}
  - {label: "UST 5Y", ticker: "^FVX"}
  - {label: "UST 10Y", ticker: "^TNX"}
  - {label: "UST 30Y", ticker: "^TYX"}

# Overnight fixings (all free, no API key).
fixings:
  - {label: SOFR,   source: fred, id: SOFR}
  - {label: EFFR,   source: fred, id: EFFR}
  - {label: "€STR", source: fred, id: ECBESTRVOLWGTTRMDMNRT}
  - {label: SONIA,  source: fred, id: IUDSOIA}
  - {label: CORRA,  source: boc,  id: AVG.INTWO}
  - {label: "RBA cash", source: rba, id: FIRMMCRTD}
  - {label: "AU 3M BAB", source: rba, id: FIRMMBAB90}

fed_speeches_rss: "https://www.federalreserve.gov/feeds/speeches.xml"

# Curves with no free futures feed. Shown only when "Show mock rows" is on,
# and always tagged MOCK.
mock_curves: [Euribor, SONIA, CORRA, SARON, Aussie Bills]

colors:
  SOFR: "#ff6fae"
  Euribor: "#4ade80"
  SONIA: "#fbbf24"
  CORRA: "#2dd4bf"
  SARON: "#fb923c"
  Aussie Bills: "#d9c7a3"
