# STIR Monitor configuration. Every external identifier lives here.

# ----------------------------------------------------------------------------- data provider
# auto  = IBKR first (TWS / IB Gateway must be running with the API enabled), Yahoo fallback
#         for SOFR + Fed Funds when IBKR is not reachable
# ibkr  = IBKR only
# yahoo = Yahoo only (SOFR + Fed Funds; other curves have no free Yahoo feed)
provider: auto

ibkr:
  host: 127.0.0.1
  port: 7497            # TWS live 7496 / paper 7497 · IB Gateway live 4001 / paper 4002
  client_id: 37
  market_data_type: 3   # 1 live · 3 delayed (free, ~10-15 min) · 4 delayed-frozen
  timeout: 15

yahoo:
  ticker_template: "{root}{month}{yy}.{exchange}"
  intraday_interval: "5m"
  intraday_period: "5d"
  daily_period: "1y"

# ----------------------------------------------------------------------------- outrights
# Codes follow the 3M-RFR convention: the month is the START of the reference quarter
# (SR3 Z26 = Dec-26 -> Mar-27). Euribor and ASX bills expire IN their month, so U26 is gone.
contracts: [U26, Z26, H27, M27, U27, Z27, H28, M28, U28, Z28, H29, M29]
extra_contracts: [Z29]   # fetched for the Z8Z9 spread only
dec_pairs: [[Z26, Z27, Z6Z7], [Z27, Z28, Z7Z8], [Z28, Z29, Z8Z9]]
sentiment_contract: Z27

