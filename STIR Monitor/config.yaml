# ----------------------------------------------------------------------------- meetings
# FOMC decision days (day 2), from federalreserve.gov/monetarypolicy/fomccalendars.htm.
# 2027 is the Fed's published (tentative) schedule; the 26-27 Oct 2027 Monetary Policy
# Strategy Meeting is not a rate-decision meeting and is excluded.
fomc_meetings: [2026-12-09, 2027-01-27, 2027-03-17, 2027-04-28, 2027-06-09, 2027-07-28, 2027-09-15, 2027-11-17]

# BoC rate announcements, from the Bank of Canada's 2027 schedule (published 15 Jul 2026).
