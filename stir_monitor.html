<html lang="en">
<head>
<meta charset="utf-8">

<title>STIR Monitor</title>

<style>
:root{
  --bg:#12161f; --card:#1b212d; --border:#2a3242; --border-soft:#232a38;
  --text:#d7dce5; --muted:#8a93a4; --faint:#5d6576; --accent:#22d3ee;
  --pos:34,197,94; --neg:239,68,68; --zero:#363d4b;
  --sofr:#ff6fae; --euribor:#4ade80; --sonia:#fbbf24; --corra:#2dd4bf; --saron:#fb923c; --aussie:#d9c7a3;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'IBM Plex Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:var(--sans);font-size:13px;line-height:1.45;padding:20px;-webkit-font-smoothing:antialiased}
.mono,table,.pill,.chip,.card-title,.stepper,.badge,.tag{font-family:var(--mono)}

/* top bar */
.topbar{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 16px}
.topbar h1{font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;margin:0}
.topbar h1 span{color:var(--accent)}
.topbar .meta{font-family:var(--mono);color:var(--muted);font-size:11px;letter-spacing:.06em}

/* grid */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.span-12{grid-column:span 12}.span-7{grid-column:span 7}.span-6{grid-column:span 6}.span-5{grid-column:span 5}
@media (max-width:1100px){.span-7,.span-5{grid-column:span 12}}
@media (max-width:900px){.span-6{grid-column:span 12}}
@media (max-width:600px){body{padding:12px}.grid{gap:12px}}

/* card */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;min-width:0}
.card-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-title{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--text);margin:0}
.card-title::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--accent);flex:none}
.card-title .sub{color:var(--muted);font-weight:500;letter-spacing:.08em}
.note{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:10px;letter-spacing:.03em}

/* pills & toggles */
.pills{display:flex;flex-wrap:wrap;gap:4px}
.pill{background:transparent;border:1px solid var(--border);color:var(--muted);font-size:11px;padding:3px 9px;border-radius:999px;cursor:pointer;letter-spacing:.03em;transition:all .12s}
.pill:hover{color:var(--text);border-color:#3b4558}
.pill.active{background:rgba(34,211,238,.14);border-color:var(--accent);color:var(--accent)}
.toggle{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.toggle .pill{border:0;border-radius:0;padding:4px 11px}
.toggle .pill+.pill{border-left:1px solid var(--border)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* tables */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:3px;width:100%;font-size:12px}
th{color:var(--muted);font-weight:500;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:4px 6px;text-align:center;white-space:nowrap}
th.grp{color:var(--text);border-bottom:1px solid var(--border);padding-bottom:6px}
td{padding:6px 6px;text-align:center;white-space:nowrap;border-radius:4px;border:1px solid transparent;font-variant-numeric:tabular-nums}
td.rowlab{text-align:left;font-weight:600;padding-left:2px;letter-spacing:.04em}
td.rowlab i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:7px;vertical-align:0}
td.heat{min-width:54px;color:#eef2f7}
td.heat.zero{background:var(--zero);color:#aab2c0}
td.heat.na{color:var(--faint);background:transparent}
td.maxcell{border-color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
td.num{text-align:right}
th.r{text-align:right}

/* bar chart */
.bars{display:flex;flex-direction:column;gap:9px;padding:4px 0}
.bar-row{display:grid;grid-template-columns:96px 1fr 62px;align-items:center;gap:10px;font-family:var(--mono);font-size:12px}
.bar-lab{display:flex;align-items:center;gap:7px;white-space:nowrap}
.bar-lab i{width:8px;height:8px;border-radius:2px;flex:none}
.bar-track{position:relative;height:20px}
.bar-track::before{content:"";position:absolute;left:50%;top:-5px;bottom:-5px;width:1px;background:#4a5366}
.bar{position:absolute;top:3px;height:14px;border-radius:2px;transition:all .25s ease}
.bar-val{text-align:right;font-variant-numeric:tabular-nums}
.axis{display:grid;grid-template-columns:96px 1fr 62px;gap:10px;font-family:var(--mono);font-size:10px;color:var(--faint)}
.axis div:nth-child(2){display:flex;justify-content:space-between}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{font-size:11px;border:1px solid var(--border);border-radius:6px;padding:3px 8px;background:#161b25;white-space:nowrap}
.chip b{font-weight:500;color:var(--muted);margin-right:6px}
.chip.pos span{color:rgb(var(--pos))}.chip.neg span{color:rgb(var(--neg))}
.chip.max{border-color:rgb(var(--pos))}.chip.min{border-color:var(--accent)}
.chart-wrap{overflow-x:auto}
.chart-wrap svg{display:block;width:100%;min-width:620px;height:auto}

/* speaker card */
.spk-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.badge{background:#2b3446;color:#cfe3ff;border:1px solid #3c4860;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:4px;letter-spacing:.08em}
.spk-name{font-weight:600;font-size:14px}
.spk-role{color:var(--muted);font-size:11.5px}
.score{font-family:var(--mono);font-size:12px;color:var(--text)}
.score small{color:var(--muted)}
.tag{font-size:10.5px;padding:2px 7px;border-radius:4px;letter-spacing:.04em}
.spk-date{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)}
.voting{font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:6px}
.voting .dot{width:7px;height:7px;border-radius:50%}
.warn{font-family:var(--mono);font-size:11px;color:#fbbf24;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.3);border-radius:6px;padding:5px 8px;margin:6px 0 8px}
.spk-title{font-family:var(--mono);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:10px 0 4px}
.spk-headline{font-weight:600;font-size:13.5px;margin:0 0 8px;color:#f1f4f8}
.spk-bullets{margin:0 0 12px;padding-left:16px}
.spk-bullets li{margin:3px 0;color:#c4cad5}
.spk-bullets li b{font-family:var(--mono);font-weight:500;font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.rates-read{border:1px solid rgba(34,211,238,.35);background:rgba(34,211,238,.06);border-radius:8px;padding:10px 12px}
.rates-read h4{margin:0 0 4px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--accent)}
.rates-read p{margin:0}

/* stepper */
.stepper{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.stepper button{background:#161b25;border:1px solid var(--border);color:var(--text);width:24px;height:22px;border-radius:5px;cursor:pointer;font-size:10px;line-height:1}
.stepper button:disabled{opacity:.35;cursor:default}
.stepper .n{min-width:16px;text-align:center;color:var(--text);font-weight:600}
.stepper .date{color:var(--text);margin-left:4px}
.d-pos{color:rgb(var(--pos))}.d-neg{color:rgb(var(--neg))}.d-zero{color:var(--muted)}
</style>
</head>

<script>
/* =====================================================================
   COMPUTE LAYER — raw prices / meeting pricing  ->  display numbers
   ===================================================================== */
const r2 = x => Math.round(x * 100) / 100;

/** Rate change (bp) from price change: rates up = price down. */
function outrightChange(last, ref) {
  if (last == null || ref == null) return null;
  return r2(-(last - ref) * 100);
}

/** Spread change (bp) for front/back contract: Δ(Pfront − Pback)×100. */
function spreadChange(lf, lb, rf, rb) {
  if ([lf, lb, rf, rb].some(v => v == null)) return null;
  return r2(((lf - lb) - (rf - rb)) * 100);
}

/** Cumulative moves and implied rates from per-meeting priced moves. */
function meetingPath(startRate, moves) {
  let cum = 0;
  return moves.map(m => { cum += m; return { move: m, cum: r2(cum), implied: startRate + cum / 100 }; });
}

function computeAll(D) {
  const o = D.outrights, idx = Object.fromEntries(o.contracts.map((c, i) => [c, i]));

  // outright net changes per timeframe / curve / contract
  const outr = {};
  for (const tf of Object.keys(o.reference)) {
    outr[tf] = {};
    for (const cv of Object.keys(o.last)) {
      outr[tf][cv] = Object.fromEntries(o.contracts.map((c, i) => [c, outrightChange(o.last[cv][i], o.reference[tf][cv]?.[i])]));
    }
  }

  // Dec-to-Dec spread changes
  const dec = {};
  for (const g of D.decSpreads.groups) {
    const ref = o.reference[g.timeframe];
    dec[g.timeframe] = {};
    for (const cv of D.decSpreads.curves) {
      dec[g.timeframe][cv] = D.decSpreads.pairs.map(([f, b]) =>
        spreadChange(o.last[cv][idx[f]], o.last[cv][idx[b]], ref[cv][idx[f]], ref[cv][idx[b]]));
    }
  }

  // priced-move tables: path per day-ago, plus 1D delta of cumulative
  const priced = {};
  for (const [k, p] of Object.entries(D.pricedMoves)) {
    const paths = p.history.map(m => meetingPath(p.startRate, m));
    priced[k] = paths.slice(0, -1).map((path, d) =>
      path.map((row, i) => ({ ...row, d1: r2(row.cum - paths[d + 1][i].cum) })));
  }
  return { outr, dec, priced };
}

const C = computeAll(MOCK_DATA);

/* =====================================================================
   UI HELPERS
   ===================================================================== */
const CURVE_COLOR = { SOFR: 'var(--sofr)', Euribor: 'var(--euribor)', SONIA: 'var(--sonia)', CORRA: 'var(--corra)', SARON: 'var(--saron)', 'Aussie Bills': 'var(--aussie)' };
const fmt = (v, d = 2) => v == null ? '—' : (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(d);
const el = (sel, root = document) => root.querySelector(sel);
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDate = iso => { const d = new Date(iso + 'T00:00:00Z'); return `${String(d.getUTCDate()).padStart(2,'0')} ${MON[d.getUTCMonth()]} ${String(d.getUTCFullYear()).slice(2)}`; };
const businessDaysAgo = (iso, n) => { const d = new Date(iso + 'T00:00:00Z'); while (n > 0) { d.setUTCDate(d.getUTCDate() - 1); const w = d.getUTCDay(); if (w && w !== 6) n--; } return d.toISOString().slice(0, 10); };

/** Heat cell style: green +, red −, grey 0; alpha scaled to |v| / scaleMax. */
function heatStyle(v, scaleMax) {
  if (v == null) return { cls: 'na', style: '' };
  if (Math.abs(v) < 0.005) return { cls: 'zero', style: '' };
  const t = Math.min(1, Math.abs(v) / (scaleMax || 1));
  const a = (0.14 + 0.66 * Math.sqrt(t)).toFixed(2);
  return { cls: '', style: `background:rgba(var(${v > 0 ? '--pos' : '--neg'}),${a})` };
}
const maxAbs = arr => arr.reduce((m, v) => v == null ? m : Math.max(m, Math.abs(v)), 0);
const argMaxAbs = arr => { let bi = -1, bv = -1; arr.forEach((v, i) => { if (v != null && Math.abs(v) > bv) { bv = Math.abs(v); bi = i; } }); return bv > 0 ? bi : -1; };

function heatCell(v, scale, isMax, d = 2) {
  const h = heatStyle(v, scale);
  return `<td class="heat ${h.cls}${isMax ? ' maxcell' : ''}" style="${h.style}">${fmt(v, d)}</td>`;
}
const rowLabel = cv => `<td class="rowlab"><i style="background:${CURVE_COLOR[cv]}"></i>${cv}</td>`;

/** Pill group bound to STATE[key]; re-renders via onChange. */
function pills(container, options, key, onChange) {
  container.innerHTML = options.map(o => `<button class="pill" data-v="${o}">${o}</button>`).join('');
  const sync = () => container.querySelectorAll('.pill').forEach(b => b.classList.toggle('active', b.dataset.v === STATE[key]));
  container.addEventListener('click', e => {
    const b = e.target.closest('.pill'); if (!b) return;
    STATE[key] = b.dataset.v; sync(); onChange();
  });
  sync();
}

const STATE = {
  heatmap: MOCK_DATA.heatmap.default,
  sentiment: MOCK_DATA.sentiment.default,
  curve: MOCK_DATA.curve.default,
  curveMode: MOCK_DATA.curve.defaultMode,
  daysAgo: { SOFR: 1, CORRA: 1 },
};

/* =====================================================================
   WIDGETS
   ===================================================================== */
function renderHeatmap() {
  const H = MOCK_DATA.heatmap, data = C.outr[STATE.heatmap];
  const scale = maxAbs(H.curves.flatMap(cv => H.columns.map(c => data[cv][c])));
  let html = `<thead><tr><th></th>${H.columns.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>`;
  for (const cv of H.curves) {
    const vals = H.columns.map(c => data[cv][c]), mi = argMaxAbs(vals);
    html += `<tr>${rowLabel(cv)}${vals.map((v, i) => heatCell(v, scale, i === mi)).join('')}</tr>`;
  }
  el('#heatmap-table').innerHTML = html + '</tbody>';
}

function renderDec() {
  const S = MOCK_DATA.decSpreads;
  const all = S.groups.flatMap(g => S.curves.flatMap(cv => C.dec[g.timeframe][cv]));
  const scale = maxAbs(all);
  let html = `<thead><tr><th></th>${S.groups.map(g => `<th class="grp" colspan="${S.pairs.length}">${g.label}</th>`).join('')}</tr>
    <tr><th></th>${S.groups.map(() => S.pairs.map(p => `<th>${p[2]}</th>`).join('')).join('')}</tr></thead><tbody>`;
  for (const cv of S.curves) {
    const vals = S.groups.flatMap(g => C.dec[g.timeframe][cv]), mi = argMaxAbs(vals);
    html += `<tr>${rowLabel(cv)}${vals.map((v, i) => heatCell(v, scale, i === mi)).join('')}</tr>`;
  }
  el('#dec-table').innerHTML = html + '</tbody>';
}

function renderSentiment() {
  const S = MOCK_DATA.sentiment, vals = S.changes[STATE.sentiment];
  const rows = Object.entries(vals).sort((a, b) => a[1] - b[1]);
  const lim = Math.max(2, Math.ceil(maxAbs(rows.map(r => r[1])) / 5) * 5);
  el('#sent-title').textContent = `${S.contract} · vs ${S.reference}`;
  el('#sent-bars').innerHTML = rows.map(([k, v]) => {
    const w = Math.abs(v) / lim * 50;
    const pos = v >= 0 ? `left:50%;width:${w}%` : `left:${50 - w}%;width:${w}%`;
    return `<div class="bar-row"><div class="bar-lab"><i style="background:${CURVE_COLOR[k]}"></i>${k}</div>
      <div class="bar-track"><div class="bar" style="${pos};background:${CURVE_COLOR[k]}"></div></div>
      <div class="bar-val ${v > 0 ? 'd-pos' : v < 0 ? 'd-neg' : 'd-zero'}">${fmt(v)}</div></div>`;
  }).join('');
  el('#sent-axis').innerHTML = `<div></div><div><span>${fmt(-lim, 0)}</span><span>0 bp</span><span>${fmt(lim, 0)}</span></div><div></div>`;
}

/** Catmull-Rom -> cubic Bézier path through points. */
function smoothPath(pts) {
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2, k = 6;
    d += ` C${p1[0] + (p2[0] - p0[0]) / k},${p1[1] + (p2[1] - p0[1]) / k} ${p2[0] - (p3[0] - p1[0]) / k},${p2[1] - (p3[1] - p1[1]) / k} ${p2[0]},${p2[1]}`;
  }
  return d;
}

function renderCurve() {
  const M = MOCK_DATA.curve.data[STATE.curveMode];
  const vals = M.changes[STATE.curve], labels = M.contracts;
  const imax = vals.indexOf(Math.max(...vals)), imin = vals.indexOf(Math.min(...vals));
  el('#curve-sub').textContent = `· ${STATE.curveMode} · bp vs ${MOCK_DATA.curve.reference}`;
  el('#curve-chips').innerHTML = labels.map((c, i) =>
    `<span class="chip ${vals[i] > 0 ? 'pos' : vals[i] < 0 ? 'neg' : ''}${i === imax ? ' max' : i === imin ? ' min' : ''}"><b>${c}</b><span>${fmt(vals[i], 1)}</span></span>`).join('');

  const W = 960, Hh = 300, pad = { l: 56, r: 24, t: 34, b: 34 };
  const lo = Math.min(0, ...vals), hi = Math.max(0, ...vals), span = (hi - lo) || 1;
  const yMin = lo - span * 0.08, yMax = hi + span * 0.12;
  const x = i => pad.l + i * (W - pad.l - pad.r) / (vals.length - 1);
  const y = v => pad.t + (yMax - v) / (yMax - yMin) * (Hh - pad.t - pad.b);
  const pts = vals.map((v, i) => [x(i), y(v)]);
  const ticks = []; const step = niceStep((yMax - yMin) / 5);
  for (let t = Math.ceil(yMin / step) * step; t <= yMax; t += step) ticks.push(t);
  const area = smoothPath(pts) + ` L${x(vals.length - 1)},${y(Math.max(lo, 0))} L${x(0)},${y(Math.max(lo, 0))} Z`;

  el('#curve-chart').innerHTML = `
  <svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Net change curve">
    <defs><linearGradient id="cg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".22"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(t => `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(t)}" y2="${y(t)}" stroke="${Math.abs(t) < 1e-9 ? '#5d6576' : '#262e3c'}" stroke-dasharray="${Math.abs(t) < 1e-9 ? '' : '2 4'}"/>
      <text x="${pad.l - 8}" y="${y(t) + 4}" text-anchor="end" fill="#6b7385" font-size="10" font-family="IBM Plex Mono">${Math.round(t)}</text>`).join('')}
    <path d="${area}" fill="url(#cg)"/>
    <path d="${smoothPath(pts)}" fill="none" stroke="#22d3ee" stroke-width="2"/>
    ${pts.map(([px, py], i) => {
      const hl = i === imax ? '#22c55e' : i === imin ? '#22d3ee' : null;
      return `${hl ? `<circle cx="${px}" cy="${py}" r="9" fill="${hl}" fill-opacity=".18"/>` : ''}
        <circle cx="${px}" cy="${py}" r="${hl ? 4.5 : 3}" fill="${hl || '#1b212d'}" stroke="${hl || '#22d3ee'}" stroke-width="1.5"/>
        <text x="${i === 0 ? px + 8 : px}" y="${i === imin ? py + 22 : py - (hl ? 14 : 10)}" text-anchor="${i === 0 ? 'start' : 'middle'}" font-family="IBM Plex Mono" font-size="${hl ? 11.5 : 10.5}" font-weight="${hl ? 700 : 400}" fill="${hl || '#c4cad5'}">${fmt(vals[i], 1)}</text>
        <text x="${px}" y="${Hh - 12}" text-anchor="middle" font-family="IBM Plex Mono" font-size="10.5" fill="#8a93a4">${labels[i]}</text>`;
    }).join('')}
    <text x="${W - pad.r}" y="16" text-anchor="end" font-family="IBM Plex Mono" font-size="10" fill="#6b7385">● max  <tspan fill="#22c55e">${labels[imax]} ${fmt(vals[imax], 1)}</tspan>   ● min  <tspan fill="#22d3ee">${labels[imin]} ${fmt(vals[imin], 1)}</tspan></text>
  </svg>`;
}
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p; return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * p; }

function renderPriced(card) {
  const key = card.dataset.key, P = MOCK_DATA.pricedMoves[key], days = STATE.daysAgo[key];
  const rows = C.priced[key][days], maxDays = C.priced[key].length - 1;
  const date = businessDaysAgo(MOCK_DATA.meta.asOf, days);
  const scale = maxAbs(rows.map(r => r.move)), mi = argMaxAbs(rows.map(r => r.move));
  card.innerHTML = `
    <div class="card-head">
      <h2 class="card-title">Priced Moves <span class="sub">· ${P.label}</span></h2>
      <div class="stepper"><button data-s="1" aria-label="More days ago" ${days >= maxDays ? 'disabled' : ''}>▼</button>
        <span class="n">${days}</span><button data-s="-1" aria-label="Fewer days ago" ${days <= 0 ? 'disabled' : ''}>▲</button>
        <span>DAYS AGO</span><span class="date">${fmtDate(date)}</span></div>
    </div>
    <div class="scroll"><table>
      <thead><tr><th style="text-align:left">Meeting</th><th>Move (bp)</th><th class="r">Cum (bp)</th><th class="r">Implied (%)</th><th class="r">Δ 1D (bp)</th></tr></thead>
      <tbody>${rows.map((r, i) => `<tr>
        <td class="rowlab" style="font-weight:500">${fmtDate(P.meetings[i])}</td>
        ${heatCell(r.move, scale, i === mi, 1)}
        <td class="num">${fmt(r.cum, 1)}</td>
        <td class="num">${r.implied.toFixed(3)}</td>
        <td class="num ${r.d1 > 0 ? 'd-pos' : r.d1 < 0 ? 'd-neg' : 'd-zero'}">${fmt(r.d1, 1)}</td></tr>`).join('')}
      </tbody></table></div>
    <div class="note">Start rate ${P.startRate.toFixed(2)}% · Implied = start + cumulative · Δ1D on cumulative.</div>`;
  card.querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
    STATE.daysAgo[key] = Math.max(0, Math.min(maxDays, days + Number(b.dataset.s))); renderPriced(card);
  });
}

const TOPIC = /^(Growth|Labour|Inflation|Expectations|Policy stance|Reaction function|Risks|Balance sheet|Pace):/;
function speakerCard(s) {
  const avg4 = s.last4.reduce((a, b) => a + b, 0) / s.last4.length;
  const score = (s.last4.reduce((a, b) => a + b, 0) + s.hawkish) / (s.last4.length + 1);
  const dev = s.hawkish - avg4;
  const tagColor = s.hawkish >= 6 ? 'rgb(var(--neg))' : s.hawkish <= 4 ? 'rgb(var(--pos))' : 'var(--muted)';
  const tagLabel = s.hawkish >= 6 ? 'Hawkish' : s.hawkish <= 4 ? 'Dovish' : 'Neutral';
  const votes = /^Always|votes in next/i.test(s.voting) && !/Doesn't/i.test(s.voting);
  return `<article class="card span-6">
    <div class="spk-head">
      <span class="badge">${s.bank}</span>
      <span class="spk-name">${s.name}</span><span class="spk-role">${s.role}</span>
      <span class="score">${score.toFixed(1)} <small>(${s.last4.length + 1})</small></span>
      <span class="tag" style="color:${tagColor};background:color-mix(in srgb, ${tagColor} 14%, transparent);border:1px solid color-mix(in srgb, ${tagColor} 45%, transparent)">${tagLabel} ${s.hawkish}/10</span>
      <span class="spk-date">${fmtDate(s.date)}</span>
    </div>
    <div class="voting"><span class="dot" style="background:${votes ? 'rgb(var(--pos))' : 'var(--faint)'}"></span>${s.voting}</div>
    ${Math.abs(dev) >= 1.5 ? `<div class="warn">⚠ Today ${s.hawkish}/10 is ${fmt(dev, 1)} vs his last-4 average of ${avg4.toFixed(1)} — ${dev > 0 ? 'notably more hawkish' : 'notably more dovish'} than usual.</div>` : ''}
    <div class="spk-title">${s.title}</div>
    <p class="spk-headline">${s.headline}</p>
    <ul class="spk-bullets">${s.bullets.map(b => `<li>${b.replace(TOPIC, '<b>$1</b> ·')}</li>`).join('')}</ul>
    <div class="rates-read"><h4>RATES READ</h4><p>${s.ratesRead}</p></div>
  </article>`;
}

/* =====================================================================
   BOOT
   ===================================================================== */
el('#asof').textContent = `AS OF ${fmtDate(MOCK_DATA.meta.asOf).toUpperCase()} · ${MOCK_DATA.meta.asOfTime}`;
